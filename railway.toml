# Railway config-as-code — see https://docs.railway.com/reference/config-as-code
#
# Migrations run via `preDeployCommand` (after build, before the new
# container receives traffic) rather than being chained into the start
# command, so a failed migration blocks the deploy instead of starting a
# broken server.
#
# This file does not create the PostgreSQL database or set secrets —
# those are done once from the Railway dashboard. See README.md for the
# full walkthrough, including how to reference the Postgres plugin's
# DATABASE_URL and how RAILWAY_PUBLIC_DOMAIN is picked up automatically.

[build]
builder = "RAILPACK"

[deploy]
preDeployCommand = "python manage.py migrate --noinput"
startCommand = "gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --workers 1 --timeout 60 --bind 0.0.0.0:$PORT"
healthcheckPath = "/health/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
